name: Avisos PAES X

on:
  schedule:
    # 12:00 UTC = 08:00 en Chile (horario de invierno, UTC-4) / 09:00 en horario de verano (UTC-3)
    # Ajusta la hora si quieres que se publique más tarde o más temprano.
    - cron: "0 12 * * *"
  workflow_dispatch: {}  # permite ejecutarlo manualmente desde la pestaña Actions para probar

permissions:
  contents: write

jobs:
  avisos:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Ejecutar bot
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python3 bot.py

      - name: Guardar registro de avisos enviados (con reintento si hay choque con otro workflow)
        run: |
          git config user.name "paes-x-bot"
          git config user.email "actions@github.com"
          git add sent_log.json
          if git diff --cached --quiet; then
            echo "Nada nuevo que guardar."
            exit 0
          fi
          git commit -m "Actualiza registro de avisos enviados"
          for intento in 1 2 3 4 5; do
            if git push; then
              echo "Push OK."
              exit 0
            fi
            echo "Push rechazado (probablemente otro workflow escribió al mismo tiempo). Reintentando ($intento)..."
            git fetch origin main
            git rebase origin/main
            sleep $((RANDOM % 10 + 3))
          done
          echo "ERROR: no se pudo hacer push de sent_log.json tras varios intentos." >&2
          exit 1
