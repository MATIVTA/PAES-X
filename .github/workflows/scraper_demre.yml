name: Scraper calendario DEMRE

on:
  schedule:
    # Lunes a las 14:20 UTC. El calendario de DEMRE no cambia todos los
    # días, así que con 1 vez por semana alcanza.
    - cron: "20 14 * * 1"
  workflow_dispatch: {}  # para probarlo manualmente desde la pestaña Actions

permissions:
  contents: write

jobs:
  scraper:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Buscar eventos nuevos en el calendario de DEMRE
        run: python3 scripts/scraper_demre.py

      - name: Commit de eventos nuevos (con reintento si hay choque con otro workflow)
        run: |
          git config user.name "paes-x-bot"
          git config user.email "actions@github.com"
          git add events.json
          if git diff --cached --quiet; then
            echo "Nada nuevo que guardar."
            exit 0
          fi
          git commit -m "Auto: nuevos eventos detectados en calendario DEMRE"
          for intento in 1 2 3 4 5; do
            if git push; then
              echo "Push OK."
              exit 0
            fi
            echo "Push rechazado (probablemente otro workflow escribió al mismo tiempo). Reintentando ($intento)..."
            git fetch origin main
            git rebase origin/main
            sleep $((RANDOM % 10 + 3))
          done
          echo "ERROR: no se pudo hacer push de events.json tras varios intentos." >&2
          exit 1
