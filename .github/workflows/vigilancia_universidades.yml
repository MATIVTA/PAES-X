name: Scraper páginas de universidades

on:
  schedule:
    # Todos los días a las 16:45 UTC (lejos de avisos.yml a las 12:00).
    - cron: "45 16 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  scraper:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Buscar y publicar fechas de ensayos en páginas de universidades
        run: python3 scripts/scraper_universidades.py

      - name: Commit de eventos nuevos (con reintento si hay choque con otro workflow)
        run: |
          git config user.name "paes-x-bot"
          git config user.email "actions@github.com"
          git add events.json discovered_pages.json
          if git diff --cached --quiet; then
            echo "Nada nuevo que guardar."
            exit 0
          fi
          git commit -m "Auto: eventos y estado detectados en páginas de universidades"
          for intento in 1 2 3 4 5; do
            if git push; then
              echo "Push OK."
              exit 0
            fi
            echo "Push rechazado (probablemente otro workflow escribió al mismo tiempo). Reintentando ($intento)..."
            git fetch origin main
            git rebase origin/main
            sleep $((RANDOM % 10 + 3))
          done
          echo "ERROR: no se pudo hacer push tras varios intentos." >&2
          exit 1
